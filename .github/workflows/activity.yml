name: Refresh contribution activity

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_activity.py'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: contribution-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate contribution snapshots
        run: python3 scripts/update_activity.py
      - name: Commit changed snapshots
        run: |
          git add -- assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contribution activity'
          git push
