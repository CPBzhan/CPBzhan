<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-labelledby="terminal-title terminal-desc">
  <title id="terminal-title">Charlie Wang — profile terminal</title>
  <desc id="terminal-desc">charlie@edinburgh: ~. whoami: Charlie Wang / CPBzhan. Computer Science, University of Edinburgh. Algorithms. Creative coding. Game design.</desc>
  <defs>
    <clipPath id="terminal-copy">
      <rect class="type-reveal" x="65" y="228" width="880" height="40"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .type-reveal { animation: type-line 14s steps(44, end) infinite; }
      @keyframes type-line {
        0%, 7% { width: 0; }
        54%, 100% { width: 880px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .type-reveal { animation: none; width: 880px; }
      }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="#080d14" stroke="#22313d"/>
  <path d="M16 1H984A15 15 0 0 1 999 16V56H1V16A15 15 0 0 1 16 1Z" fill="#0e1721"/>
  <path d="M1 56.5H999" stroke="#22313d"/>
  <circle cx="30" cy="29" r="4" fill="#6ef3c5"/>
  <circle cx="46" cy="29" r="4" fill="#f6c776"/>
  <circle cx="62" cy="29" r="4" fill="#22313d"/>
  <text x="89" y="35" class="mono" font-size="18" fill="#8a9ba8">charlie@edinburgh: ~</text>
  <text x="963" y="34" class="mono" font-size="12" letter-spacing="2" text-anchor="end" fill="#8a9ba8">PROFILE / 01</text>
  <g class="mono" font-size="22">
    <text x="36" y="103" fill="#6ef3c5">$<tspan dx="15" fill="#e7f3f5">whoami</tspan></text>
  </g>
  <text x="36" y="148" class="sans" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5" fill="#e7f3f5">Charlie Wang<tspan font-size="23" font-weight="400" fill="#8a9ba8"> / CPBzhan</tspan></text>
  <text x="36" y="184" class="sans" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8a9ba8">Computer Science <tspan fill="#6ef3c5">·</tspan> University of Edinburgh</text>
  <path d="M36 212.5H964" stroke="#22313d"/>
  <text x="36" y="255" class="mono" font-size="22" fill="#8a9ba8">$</text>
  <g clip-path="url(#terminal-copy)">
    <text x="65" y="255" class="mono" font-size="22" fill="#6ef3c5">Algorithms. Creative coding. Game design.</text>
  </g>
</svg>
