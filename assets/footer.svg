<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
<title id="title">Build something cool. Learn something new.</title><desc id="desc">An animated mint waveform beside Charlie's motto.</desc>
<defs><linearGradient id="line"><stop stop-color="#22313d"/><stop offset=".5" stop-color="#6ef3c5"/><stop offset="1" stop-color="#22313d"/></linearGradient></defs>
<style>.wave{stroke-dasharray:130 600;animation:flow 7s linear infinite}@keyframes flow{to{stroke-dashoffset:-730}}@media(prefers-reduced-motion:reduce){.wave{animation:none;stroke-dasharray:none}}</style>
<rect x=".5" y=".5" width="999" height="179" rx="16" fill="#080d14" stroke="#22313d"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="43" fill="#6ef3c5" font-size="13" letter-spacing="3">THE NEXT IDEA STARTS WITH A CONVERSATION</text><text x="42" y="91" fill="#e7f3f5" font-size="32" font-weight="700" letter-spacing="-1">Build something cool.</text><text x="42" y="134" fill="#94aeb9" font-size="32" letter-spacing="-1">Learn something new.</text></g>
<path d="M640 94h50l18-25 22 50 24-82 28 106 24-68 18 19h134" fill="none" stroke="#203d3c" stroke-width="2"/>
<path class="wave" d="M640 94h50l18-25 22 50 24-82 28 106 24-68 18 19h134" fill="none" stroke="url(#line)" stroke-width="2"/>
</svg>