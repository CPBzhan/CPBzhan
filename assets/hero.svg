<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Charlie Wang — Curiosity, compiled.</title>
  <desc id="desc">Computer Science at the University of Edinburgh. Mint orbital geometry rotates beside Charlie's name.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset=".55" stop-color="#f0faf7"/><stop offset="1" stop-color="#e5f4ef"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#8bd9c1" stop-opacity=".32"/><stop offset="1" stop-color="#f5faf9" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d7e77"/><stop offset=".5" stop-color="#359e8b"/><stop offset="1" stop-color="#4e9c94"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#077b71"/><stop offset=".6" stop-color="#b8d7ce"/><stop offset="1" stop-color="#f5faf9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#529b96" stroke-opacity=".045"/></pattern>
    <clipPath id="bounds"><rect width="1000" height="430" rx="18"/></clipPath>
  </defs>
  <style>
    .orbit{animation:turn 28s linear infinite;transform-origin:790px 212px}
    .counter{animation:reverseTurn 38s linear infinite;transform-origin:790px 212px}
    .signal{animation:pulse 3.4s ease-in-out infinite}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes reverseTurn{to{transform:rotate(-360deg)}}
    @keyframes pulse{50%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.orbit,.counter,.signal{animation:none}}
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1000" height="430" fill="url(#paper)"/>
    <rect width="1000" height="430" fill="url(#grid)"/>
    <circle cx="790" cy="212" r="275" fill="url(#halo)"/>
    <g opacity="1">
      <g transform="translate(790 212) rotate(-24)" stroke="url(#orb)" stroke-width=".8" opacity=".72"><ellipse cx="0" cy="0" rx="155" ry="36" transform="rotate(0)"/><ellipse cx="0" cy="0" rx="155" ry="78" transform="rotate(0)"/><ellipse cx="0" cy="0" rx="155" ry="120" transform="rotate(0)"/><ellipse cx="0" cy="0" rx="155" ry="155" transform="rotate(0)"/><ellipse cx="0" cy="0" rx="155" ry="36" transform="rotate(90)"/><ellipse cx="0" cy="0" rx="155" ry="78" transform="rotate(90)"/><ellipse cx="0" cy="0" rx="155" ry="120" transform="rotate(90)"/></g>
      <g class="orbit"><ellipse cx="790" cy="212" rx="192" ry="66" transform="rotate(-28 790 212)" stroke="#077b71" stroke-opacity=".65"/><circle cx="959.5" cy="121.9" r="5" fill="#147d72"/><circle cx="959.5" cy="121.9" r="10" stroke="#077b71" stroke-opacity=".3"/></g>
      <g class="counter"><circle cx="790" cy="212" r="175" stroke="#077b71" stroke-opacity=".26" stroke-dasharray="2 15"/><path d="M615 212a175 175 0 0 1 175 -175" stroke="#077b71" stroke-width="2" stroke-opacity=".7"/></g>
      <circle cx="965.0" cy="285.99" r="2" fill="#289483" opacity="0.7"/><circle cx="666.07" cy="350.7" r="2" fill="#289483" opacity="0.8"/><circle cx="750.37" cy="28.22" r="3" fill="#289483" opacity="0.8"/><circle cx="942.36" cy="60.31" r="1" fill="#289483" opacity="0.5"/><circle cx="602.38" cy="182.03" r="1" fill="#289483" opacity="0.7"/>
      <path d="M780 212h20M790 202v20" stroke="#23796e"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" fill="#18343e">
      <text x="52" y="54" font-size="14" letter-spacing="3" fill="#077b71">CPBZHAN / PERSONAL ORBIT</text>
      <text x="52" y="169" font-size="76" font-weight="700" letter-spacing="-4">Charlie Wang<tspan fill="#077b71">.</tspan></text>
      <text x="54" y="221" font-size="28" fill="#496671">Curiosity, compiled.</text>
      <text x="54" y="267" font-size="18" fill="#586f79">COMPUTER SCIENCE · EDINBURGH</text>
      <circle class="signal" cx="59" cy="305" r="4" fill="#077b71"/>
      <text x="74" y="311" font-size="15" fill="#496671">Learning. Building. Iterating.</text>
      <text x="52" y="385" font-size="16" letter-spacing="2" fill="#586f79">ALGORITHMS</text><text x="235" y="385" font-size="16" letter-spacing="2" fill="#586f79">CREATIVE CODE</text><text x="461" y="385" font-size="16" letter-spacing="2" fill="#586f79">PLAY</text><text x="948" y="385" text-anchor="end" font-size="14" fill="#077b71">KEEP EXPLORING ↗</text>
    </g>
    <path d="M52 347H948" stroke="url(#edge)"/>
    <rect x=".5" y=".5" width="999" height="429" rx="17.5" stroke="#cfdfdc"/>
  </g>
</svg>